<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expiry Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f1f5f9;
      overflow-x: hidden;
    }

    @keyframes slideDown {
      0% {
        transform: translateY(-100%);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(0.95);
        height: 0;
        margin: 0;
        padding: 0;
      }
    }

    .navbar {
      background-color: #6366F1;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideDown 0.5s ease-out;
    }

    .navbar h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }

    .navbar a:hover {
      background-color: #4338CA;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 16px;
      animation: fadeInUp 0.6s ease;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin: 16px 0;
      font-weight: bold;
      animation: fadeInUp 0.6s ease;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      animation: fadeInUp 0.7s ease;
    }

    form input, form button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      transition: all 0.3s ease;
    }

    form input:focus {
      outline: none;
      border-color: #6366F1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    form button {
      background-color: #6366F1;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 16px;
    }

    form button:hover {
      background-color: #4338CA;
    }

    ul.grocery-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .grocery-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      padding: 14px 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInUp 0.5s ease forwards;
    }

    .grocery-item.expired {
      background-color: #fee2e2 !important;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .item-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .item-left strong {
      font-size: 1.1rem;
      color: #111827;
    }

    .item-left small {
      color: #6B7280;
      font-size: 0.9rem;
    }

    .days-left {
      font-size: 1.4rem;
      font-weight: bold;
      color: #10B981;
      text-align: right;
      min-width: 80px;
      transition: color 0.3s ease;
    }

    .days-left.red {
      color: #EF4444;
    }

    .days-left small {
      display: block;
      font-size: 0.8rem;
      font-weight: normal;
      color: #6B7280;
    }

    .remove-btn {
      background-color: #EF4444;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 1.2rem;
      border-radius: 50%;
      cursor: pointer;
      margin-left: 10px;
      transition: background-color 0.3s ease;
    }

    .remove-btn:hover {
      background-color: #b91c1c;
    }

    .right-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer {
      text-align: center;
      font-size: 0.9rem;
      color: #6B7280;
      margin-top: 30px;
    }

    @media (max-width: 480px) {
      .grocery-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .right-content {
        justify-content: space-between;
        width: 100%;
        margin-top: 10px;
      }

      .days-left {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>Expiry Tracker</h2>
    <a href="/">Home</a>
  </div>

  <div class="container">
    <h1 id="pageTitle">Management</h1>

    <form id="groceryForm">
      <input type="text" id="itemName" placeholder="Enter item name" required />
      <input type="text" id="batchNo" placeholder="Enter batch number" required />
      <input type="date" id="expiryDate" required />
      <button type="submit">Add Item</button>
    </form>

    <ul class="grocery-list" id="groceryList"></ul>

    <div class="footer">
      Expiry Tracker — Stay Organized!
    </div>
  </div>

  <script>
    const form = document.getElementById('groceryForm');
    const groceryList = document.getElementById('groceryList');
    const expiryDateInput = document.getElementById('expiryDate');
    const pageTitle = document.getElementById('pageTitle');

    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'grocery';
    const storageKey = `${type}Items`;

    const capitalized = type.charAt(0).toUpperCase() + type.slice(1);
    pageTitle.textContent = `${capitalized} Management`;

    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    expiryDateInput.min = tomorrow.toISOString().split('T')[0];

    function loadItems() {
      let items = JSON.parse(localStorage.getItem(storageKey)) || [];

      // Sort items by expiry date (soonest first)
      items.sort((a, b) => new Date(a.expiryDate) - new Date(b.expiryDate));

      groceryList.innerHTML = '';
      items.forEach((item, i) => addListItem(item, i));
    }


    function addListItem(item, index = 0) {
    const expiryDate = new Date(item.expiryDate);
    const now = new Date();
    const timeDiff = expiryDate - now;
    const daysLeft = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
    const expiryStr = expiryDate.toLocaleDateString('en-GB');

    const li = document.createElement('li');
      li.classList.add('grocery-item');
      if (daysLeft <= 0) li.classList.add('expired'); // Add red style for expired
      li.dataset.id = item.id;
      li.style.animationDelay = `${index * 0.1}s`;

    const statusHTML = daysLeft < 0
      ? `<div class="days-left red">Expired</div>`
      : `<div class="days-left ${daysLeft <= 7 ? 'red' : ''}">
          ${daysLeft}<small>Days Left</small>
        </div>`;

    li.innerHTML = `
      <div class="item-left">
        <strong>${item.name}</strong>
        <small>Batch: ${item.batch}</small>
        <small>Expiry: ${expiryStr}</small>
      </div>
      <div class="right-content">
        ${statusHTML}
        <button class="remove-btn">−</button>
      </div>
    `;
    groceryList.appendChild(li);
  }

    function saveItem(item) {
      const items = JSON.parse(localStorage.getItem(storageKey)) || [];
      items.push(item);
      localStorage.setItem(storageKey, JSON.stringify(items));
    }

    function removeItem(id) {
      let items = JSON.parse(localStorage.getItem(storageKey)) || [];
      items = items.filter(item => item.id !== id);
      localStorage.setItem(storageKey, JSON.stringify(items));
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('itemName').value.trim();
      const batch = document.getElementById('batchNo').value.trim();
      const expiryDate = document.getElementById('expiryDate').value;

      const item = {
        id: Date.now().toString(),
        name,
        batch,
        expiryDate
      };

      addListItem(item);
      saveItem(item);
      form.reset();
    });

    groceryList.addEventListener('click', function(e) {
      if (e.target.classList.contains('remove-btn')) {
        const li = e.target.closest('.grocery-item');
        const id = li.dataset.id;
        li.style.animation = 'fadeOut 0.3s forwards';
        setTimeout(() => {
          li.remove();
          removeItem(id);
        }, 300);
      }
    });

    loadItems();
  </script>
</body>
</html>
