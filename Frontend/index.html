<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expiry Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #F9FAFB;
      color: #111827;
    }

    .navbar {
      width: 100%;
      background-color: #6366F1;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    .navbar a:hover {
      background-color: #4338CA;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    .subtitle {
      font-size: 1.1rem;
      margin-bottom: 40px;
      color: #6B7280;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
      padding: 24px;
      width: 90%;
      max-width: 280px;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .card h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #111827;
    }

    .card p {
      font-size: 0.98rem;
      color: #4B5563;
      margin-bottom: 16px;
    }

    button {
      background-color: #6366F1;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #3730A3;
    }


    @media (min-width: 768px) {
      h1 {
        font-size: 2.8rem;
      }

      .subtitle {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>Expiry Tracker</h2>
    <a href="#">Profile</a>
  </div>

  <div class="container">
    <p class="subtitle">
      Stay ahead of expiry dates by organizing your groceries, medicines, and essential products in one simple place.
    </p>

    <div class="card-container" id="cardContainer">

    </div>


  <script>
    const features = [
      {
        title: "Grocery Management",
        description: "Add groceries, set expiry dates, and get timely notifications.",
        path: "grocery"
      },
      {
        title: "Medicine Tracker",
        description: "Track medicine usage and receive alerts before expiry.",
        path: "medicine"
      },
      {
        title: "Product Reminder",
        description: "Manage custom products and their expiry efficiently.",
        path: "product"
      }
    ];

    const container = document.getElementById("cardContainer");

    features.forEach((feature) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h2>${feature.title}</h2>
        <p>${feature.description}</p>
        <button onclick="navigate('${feature.path}')">Go to ${feature.title}</button>
      `;
      container.appendChild(card);
    });

    function navigate(path) {
      // alert("Navigating to: " + path + " (implement real routing here)");
      window.location.href = path + ".html";
    }
  </script>
</body>
</html>
