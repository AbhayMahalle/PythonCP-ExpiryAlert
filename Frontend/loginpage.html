<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expiry Tracker - Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #F9FAFB;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .auth-box {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      font-size: 1.8rem;
      color: #4F46E5;
      margin-bottom: 10px;
    }

    p {
      font-size: 1rem;
      color: #6B7280;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      font-size: 1rem;
    }

    button {
      width: 100%;
      background-color: #6366F1;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #4338CA;
    }

    .toggle-link {
      display: block;
      margin-top: 16px;
      color: #4F46E5;
      cursor: pointer;
      font-size: 0.95rem;
    }

    #full-name-group {
      display: none;
    }

    @media (max-width: 500px) {
      .auth-box {
        margin: 20px;
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-box">
    <h2>Welcome to Expiry Tracker</h2>
    <p id="form-title">Login to your account</p>
    <form id="auth-form">
      <div class="input-group" id="full-name-group">
        <input type="text" id="full-name" placeholder="Full Name" />
      </div>
      <div class="input-group">
        <input type="email" id="email" placeholder="Email address" required />
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required />
      </div>
      <button type="submit" id="submit-btn">Login</button>
    </form>
    <span class="toggle-link" onclick="toggleForm()">Don't have an account? Sign up</span>
  </div>

  <script>
    let isLogin = true;
    const fullNameGroup = document.getElementById("full-name-group");
    const formTitle = document.getElementById("form-title");
    const submitBtn = document.getElementById("submit-btn");
    const toggleText = document.querySelector(".toggle-link");

    function toggleForm() {
      isLogin = !isLogin;
      if (isLogin) {
        fullNameGroup.style.display = "none";
        formTitle.innerText = "Login to your account";
        submitBtn.innerText = "Login";
        toggleText.innerText = "Don't have an account? Sign up";
      } else {
        fullNameGroup.style.display = "block";
        formTitle.innerText = "Create a new account";
        submitBtn.innerText = "Sign Up";
        toggleText.innerText = "Already have an account? Login";
      }
    }
  </script>
</body>
</html>
