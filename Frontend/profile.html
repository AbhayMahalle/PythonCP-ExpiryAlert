<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - Expiry Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #F9FAFB;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .profile-box {
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h2 {
      color: #4F46E5;
      margin-bottom: 24px;
    }

    .profile-img-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 16px;
    }

    .profile-pic {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #6366F1;
    }

    #image-input {
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    .profile-field {
      text-align: left;
      margin: 16px 0;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      font-size: 1rem;
    }

    button {
      width: 100%;
      background-color: #6366F1;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #4338CA;
    }

    @media (max-width: 600px) {
      .profile-box {
        padding: 24px;
      }

      .profile-pic {
        width: 100px;
        height: 100px;
      }

      .profile-img-container {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="profile-box">
    <h2>Owner Profile</h2>

    <div class="profile-img-container">
      <img id="profile-img" src="https://via.placeholder.com/130?text=+" class="profile-pic" alt="Profile Picture" />
    </div>
    <input type="file" accept="image/*" id="image-input" />

    <div class="profile-field">
      <label for="owner-name">Owner Name</label>
      <input type="text" id="owner-name" placeholder="Enter owner's name" />
    </div>
    <div class="profile-field">
      <label for="shop-name">Shop Name</label>
      <input type="text" id="shop-name" placeholder="Enter shop name" />
    </div>
    <div class="profile-field">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter email address" />
    </div>
    <div class="profile-field">
      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" placeholder="Enter contact number" />
    </div>
    <button onclick="saveProfile()">Save Profile</button>
  </div>

  <script>
    const profileImg = document.getElementById('profile-img');
    const imageInput = document.getElementById('image-input');

    // Load saved data
    window.onload = () => {
      const data = JSON.parse(localStorage.getItem('profileData'));
      if (data) {
        document.getElementById('owner-name').value = data.owner || '';
        document.getElementById('shop-name').value = data.shop || '';
        document.getElementById('email').value = data.email || '';
        document.getElementById('contact').value = data.contact || '';
        if (data.image) {
          profileImg.src = data.image;
          imageInput.classList.add('hidden');
        }
      }
    };

    // Upload image preview
    imageInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          profileImg.src = e.target.result;
          imageInput.classList.add('hidden'); // Hide upload after selection
        };
        reader.readAsDataURL(file);
      }
    });

    function saveProfile() {
      const owner = document.getElementById('owner-name').value;
      const shop = document.getElementById('shop-name').value;
      const email = document.getElementById('email').value;
      const contact = document.getElementById('contact').value;
      const imageSrc = profileImg.src;

      const profileData = {
        owner, shop, email, contact, image: imageSrc
      };

      localStorage.setItem('profileData', JSON.stringify(profileData));
      alert("Profile saved successfully!");
    }
  </script>
</body>
</html>
